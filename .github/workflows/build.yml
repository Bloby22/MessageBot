name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MessageBot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Inspect checked-out source
        shell: bash
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Ref: $GITHUB_REF"
          git log -1 --format="%H %s"

          echo "InteractionHandler.cs:"
          nl -ba src/MessageBot/Services/InteractionHandler.cs | head -40

          echo "Service declarations:"
          git grep -n -E 'class (BotService|InteractionHandler)' -- '*.cs' || true

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore src/MessageBot/MessageBot.csproj

      - name: Build
        run: >
          dotnet build src/MessageBot/MessageBot.csproj
          --configuration Release
          --no-restore
